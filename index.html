<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Productos</h1>
      <div class="usuario" id="zona-usuario" hidden>
      <span class="muted-claro" id="usuario-email"></span>
      <span class="rol" id="usuario-rol"></span>
      <button type="button" id="btn-logout">Cerrar sesión</button>
    </div>
</header>

  <main>
    <section class="card tarjeta-acceso" id="vista-acceso">
      <h2 id="titulo-acceso">Iniciar sesión</h2>
      <form id="form-acceso" novalidate>
        <div class="fila fila-1">
          <label>Email
            <input type="email" id="a-email" maxlength="100"
              autocomplete="username" placeholder="ana@demo.com">
            <span class="error" id="err-a-email"></span>
          </label>
          <label>Contraseña
            <input type="password" id="a-password" maxlength="72"
              autocomplete="current-password">
            <span class="error" id="err-a-password"></span>
          </label>
        </div>
        <div class="botones">
          <button type="submit" class="primario" id="btn-acceso">Entrar</button>
          <button type="button" id="btn-cambiar-modo">Crear una cuenta</button>
        </div>
      </form>
    </section>

    <div class="contenido" id="vista-app" hidden>
    <section class="card" id="seccion-form">
      <h2>Crear producto</h2>

      <form id="form-producto">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" maxlength="100" required>

        <label for="precio">Precio</label>
        <input id="precio" type="number" min="0" max="99999999.99" step="0.01" required>

                <label>
          Foto del producto
          <input type="file" id="imagen" accept="image/jpeg,image/png,image/webp">
          <span class="error" id="err-imagen"></span>
        </label>
        <img id="vista-previa" class="vista-previa" alt="Vista previa de la foto" hidden>
<button type="submit">Guardar</button><button type="button" id="cancelar" hidden>Cancelar</button>
      </form>

      <p id="estado-form"></p>
    </section>
    <section class="card">
      <h2>Buscar y ordenar</h2>

      <form id="form-filtros">
        <label>ID
          <input type="text" id="f-id" placeholder="3">
        </label>

        <label>Nombre
          <input type="text" id="f-nombre" placeholder="Teclado">
        </label>

        <label>Ordenar por
          <select id="f-orden">
            <option value="">Sin orden</option>
            <option value="id">ID</option>
            <option value="nombre">Nombre</option>
            <option value="precio">Precio</option>
          </select>
        </label>

        <label>Direccion
          <select id="f-direccion">
            <option value="asc">Ascendente</option>
            <option value="desc">Descendente</option>
          </select>
        </label>

                
<button type="submit">Aplicar</button>
        <button type="button" id="btn-limpiar">Limpiar</button>
        <button type="button" id="btn-baratos">Mas baratos primero</button>
      </form>

      <p id="url-actual"></p>
    </section>

    <section class="card">
      <h2>Listado (<span id="contador">0</span>)</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Foto</th>
            <th>Nombre</th>
            <th class="derecha">Precio</th><th class="derecha" id="th-acciones">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-body"></tbody>
      </table>
      <p id="estado"></p>
    </section>
      <section class="card" id="seccion-usuarios" hidden>
      <h2>Usuarios y roles (<span id="contador-usuarios">0</span>)</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Rol</th>
          </tr>
        </thead>
        <tbody id="usuarios-body"></tbody>
      </table>
    </section>
    </div>
</main>

  <div id="mensajes"></div>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
